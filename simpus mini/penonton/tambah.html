<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tambah Penonton - SaCine</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS Custom -->
    <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>

    <!-- Navbar -->
    <header class="navbar navbar-expand-md navbar-dark bg-primary">
        <div class="container">

            <a class="navbar-brand fw-bold" href="../index.html">
                SaCine
            </a>

            <button class="navbar-toggler" type="button" id="nav-toggle-btn"
                aria-controls="navMenu" aria-expanded="false" aria-label="Toggle navigation">

                <span class="navbar-toggler-icon"></span>

            </button>

            <nav id="navMenu">
                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="../index.html">
                            Beranda
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="../film/list.html">
                            Daftar Film
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="../film/tambah.html">
                            Tambah Film
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="list.html">
                            Daftar Penonton
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active" href="tambah.html">
                            Tambah Penonton
                        </a>
                    </li>

                </ul>
            </nav>

        </div>
    </header>

    <!-- Main Content -->
    <main class="container my-4">

        <div class="card shadow-sm form-card">

            <div class="card-body">

                <h2 class="mb-4">
                    Tambah Penonton
                </h2>

                <form id="form-tambah" class="form-tambah">

                    <!-- Nama -->
                    <div class="mb-3">

                        <label for="nama" class="form-label">
                            Nama
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="nama"
                            name="nama"
                            placeholder="Masukkan nama penonton"
                        >

                    </div>

                    <!-- No. Penonton -->
                    <div class="mb-3">

                        <label for="no_penonton" class="form-label">
                            No. Penonton
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="no_penonton"
                            name="no_penonton"
                            placeholder="Masukkan nomor penonton"
                        >

                    </div>

                    <!-- Alamat -->
                    <div class="mb-3">

                        <label for="alamat" class="form-label">
                            Alamat
                        </label>

                        <textarea
                            class="form-control"
                            id="alamat"
                            name="alamat"
                            rows="3"
                            placeholder="Masukkan alamat penonton"
                        ></textarea>

                    </div>

                    <!-- No. HP -->
                    <div class="mb-3">

                        <label for="no_hp" class="form-label">
                            No. HP
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="no_hp"
                            name="no_hp"
                            placeholder="Masukkan nomor HP"
                        >

                    </div>

                    <!-- Email -->
                    <div class="mb-3">

                        <label for="email" class="form-label">
                            Email
                        </label>

                        <input
                            type="email"
                            class="form-control"
                            id="email"
                            name="email"
                            placeholder="Masukkan email"
                        >

                    </div>

                    <!-- Tombol -->
                    <div class="form-buttons">

                        <button type="submit" class="btn btn-primary">
                            Simpan
                        </button>

                        <a href="list.html" class="btn btn-secondary">
                            Batal
                        </a>

                    </div>

                </form>

            </div>

        </div>

    </main>

    <!-- Footer -->
    <footer class="text-center py-3">

        <p class="mb-0">
            &copy; 2026 SaCine — Movie Management System
        </p>

    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- JavaScript utama -->
    <script src="../assets/js/app.js"></script>

</body>

</html>
