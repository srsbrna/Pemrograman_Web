<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Daftar Film - SaCine</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS Custom -->
    <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>

    <!-- Navbar -->
    <header class="navbar navbar-expand-md navbar-dark bg-primary">
        <div class="container">

            <a class="navbar-brand fw-bold" href="../index.html">
                SaCine
            </a>

            <button class="navbar-toggler" type="button" id="nav-toggle-btn"
                aria-controls="navMenu" aria-expanded="false" aria-label="Toggle navigation">

                <span class="navbar-toggler-icon"></span>

            </button>

            <nav id="navMenu">
                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="../index.html">
                            Beranda
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active" href="list.html">
                            Daftar Film
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="tambah.html">
                            Tambah Film
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="../penonton/list.html">
                            Daftar Penonton
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="../penonton/tambah.html">
                            Tambah Penonton
                        </a>
                    </li>

                </ul>
            </nav>

        </div>
    </header>


    <!-- Main Content -->
    <main class="container my-4">

        <div class="card shadow-sm">

            <div class="card-body">

                <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">

                    <h2 class="mb-0">
                        Daftar Film
                    </h2>

                    <a href="tambah.html" class="btn btn-primary">
                        + Tambah Film
                    </a>

                </div>


                <!-- Pencarian tabel -->
                <div class="mb-3">

                    <label for="search-input" class="form-label">
                        Cari film
                    </label>

                    <input type="text"
                        id="search-input"
                        class="form-control"
                        placeholder="Cari judul film..."
                        autocomplete="off">

                </div>


                <!-- Loading indicator -->
                <p id="loading-indicator" style="display:none;">
                    Memuat data film...
                </p>


                <!-- Table -->
                <div class="table-responsive">

                    <table class="table table-striped table-bordered table-hover align-middle"
                        data-filter="film">

                        <thead class="table-primary">

                            <tr>
                                <th>Judul Film</th>
                                <th>Sutradara</th>
                                <th>Genre</th>
                                <th>Tahun Rilis</th>
                                <th>Salinan</th>
                                <th>Aksi</th>
                            </tr>

                        </thead>

                        <tbody>
                            <!--
                                Baris diisi secara dinamis oleh assets/js/film.js
                                melalui fetch('../data/film.json')
                            -->
                        </tbody>

                    </table>

                </div>

            </div>

        </div>

    </main>


    <!-- Footer -->
    <footer class="text-center py-3">

        <p class="mb-0">
            &copy; 2026 SaCine — Movie Management System
        </p>

    </footer>


    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- JavaScript utama -->
    <script src="../assets/js/app.js"></script>

    <!-- JavaScript data film -->
    <script src="../assets/js/film.js"></script>

</body>

</html>
