<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tambah Film - SaCine</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS Custom -->
    <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>

    <!-- Navbar -->
    <header class="navbar navbar-expand-md navbar-dark bg-primary">
        <div class="container">

            <a class="navbar-brand fw-bold" href="../index.html">
                SaCine
            </a>

            <button class="navbar-toggler" type="button" id="nav-toggle-btn"
                aria-controls="navMenu" aria-expanded="false" aria-label="Toggle navigation">

                <span class="navbar-toggler-icon"></span>

            </button>

            <nav id="navMenu">
                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="../index.html">
                            Beranda
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="list.html">
                            Daftar Film
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active" href="tambah.html">
                            Tambah Film
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="../penonton/list.html">
                            Daftar Penonton
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="../penonton/tambah.html">
                            Tambah Penonton
                        </a>
                    </li>

                </ul>
            </nav>

        </div>
    </header>


    <!-- Main Content -->
    <main class="container my-4">

        <div class="card shadow-sm form-card">

            <div class="card-body">

                <h2 class="mb-4">
                    Tambah Film
                </h2>

                <form id="form-tambah" class="form-tambah">

                    <!-- Judul Film -->
                    <div class="mb-3">

                        <label for="judul" class="form-label">
                            Judul Film
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="judul"
                            name="judul"
                            placeholder="Masukkan judul film"
                        >

                    </div>


                    <!-- Sutradara -->
                    <div class="mb-3">

                        <label for="sutradara" class="form-label">
                            Sutradara
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="sutradara"
                            name="sutradara"
                            placeholder="Masukkan nama sutradara"
                        >

                    </div>


                    <!-- Genre -->
                    <div class="mb-3">

                        <label for="genre" class="form-label">
                            Genre
                        </label>

                        <select
                            class="form-select"
                            id="genre"
                            name="genre"
                        >

                            <option value="" selected>
                                Pilih genre
                            </option>

                            <option value="Drama">
                                Drama
                            </option>

                            <option value="Romance">
                                Romance
                            </option>

                            <option value="Comedy">
                                Comedy
                            </option>

                            <option value="Horror">
                                Horror
                            </option>

                            <option value="Action">
                                Action
                            </option>

                            <option value="Thriller">
                                Thriller
                            </option>

                            <option value="Fantasy">
                                Fantasy
                            </option>

                        </select>

                    </div>


                    <!-- Tahun Rilis -->
                    <div class="mb-3">

                        <label for="tahun" class="form-label">
                            Tahun Rilis
                        </label>

                        <input
                            type="number"
                            class="form-control"
                            id="tahun"
                            name="tahun"
                            placeholder="Masukkan tahun rilis"
                            min="1900"
                            max="2026"
                        >

                    </div>


                    <!-- Durasi -->
                    <div class="mb-3">

                        <label for="durasi" class="form-label">
                            Durasi (menit)
                        </label>

                        <input
                            type="number"
                            class="form-control"
                            id="durasi"
                            name="durasi"
                            placeholder="Masukkan durasi film"
                            min="1"
                        >

                    </div>


                    <!-- Salinan -->
                    <div class="mb-3">

                        <label for="salinan" class="form-label">
                            Jumlah Salinan
                        </label>

                        <input
                            type="number"
                            class="form-control"
                            id="salinan"
                            name="salinan"
                            placeholder="Masukkan jumlah salinan"
                            min="0"
                        >

                    </div>


                    <!-- Tombol -->
                    <div class="form-buttons">

                        <button type="submit" class="btn btn-primary">
                            Simpan
                        </button>

                        <a href="list.html" class="btn btn-secondary">
                            Batal
                        </a>

                    </div>

                </form>

            </div>

        </div>

    </main>


    <!-- Footer -->
    <footer class="text-center py-3">

        <p class="mb-0">
            &copy; 2026 SaCine — Movie Management System
        </p>

    </footer>


    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- JavaScript utama -->
    <script src="../assets/js/app.js"></script>

</body>

</html>
