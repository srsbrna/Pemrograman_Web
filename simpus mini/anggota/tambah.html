<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tambah Anggota - SIMPUS Mini</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS Custom -->
    <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-md navbar-dark" style="background-color: #1d5b8a;">
        <div class="container">
            <a class="navbar-brand fw-bold" href="../index.html">
                SIMPUS Mini
            </a>

            <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav"
                aria-controls="navbarNav"
                aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="../index.html">
                            Beranda
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="../buku/list.html">
                            Daftar Buku
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="../buku/tambah.html">
                            Tambah Buku
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="list.html">
                            Daftar Anggota
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active" href="tambah.html">
                            Tambah Anggota
                        </a>
                    </li>

                </ul>
            </div>
        </div>
    </nav>


    <!-- Main Content -->
    <main class="container my-4">

        <div class="card shadow-sm">
            <div class="card-body">

                <h2 class="mb-4">Tambah Anggota</h2>

                <form>

                    <!-- Nama -->
                    <div class="mb-3">
                        <label for="nama" class="form-label">
                            Nama
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="nama"
                            name="nama"
                            placeholder="Masukkan nama anggota"
                        >
                    </div>


                    <!-- No. Anggota -->
                    <div class="mb-3">
                        <label for="no_anggota" class="form-label">
                            No. Anggota
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="no_anggota"
                            name="no_anggota"
                            placeholder="Masukkan nomor anggota"
                        >
                    </div>


                    <!-- Alamat -->
                    <div class="mb-3">
                        <label for="alamat" class="form-label">
                            Alamat
                        </label>

                        <textarea
                            class="form-control"
                            id="alamat"
                            name="alamat"
                            rows="3"
                            placeholder="Masukkan alamat anggota"
                        ></textarea>
                    </div>


                    <!-- No. HP -->
                    <div class="mb-3">
                        <label for="no_hp" class="form-label">
                            No. HP
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="no_hp"
                            name="no_hp"
                            placeholder="Masukkan nomor HP"
                        >
                    </div>


                    <!-- Email -->
                    <div class="mb-3">
                        <label for="email" class="form-label">
                            Email
                        </label>

                        <input
                            type="email"
                            class="form-control"
                            id="email"
                            name="email"
                            placeholder="Masukkan email"
                        >
                    </div>


                    <!-- Tombol -->
                    <button type="submit" class="btn btn-primary">
                        Simpan
                    </button>

                    <a href="list.html" class="btn btn-secondary">
                        Batal
                    </a>

                </form>

            </div>
        </div>

    </main>


    <!-- Footer -->
    <footer class="text-center py-3">
        <p class="mb-0">&copy; 2026 SIMPUS Mini</p>
    </footer>


    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
