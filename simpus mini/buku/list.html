<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Buku - SIMPUS Mini</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS Custom -->
    <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-md navbar-dark" style="background-color: #1d5b8a;">
        <div class="container">
            <a class="navbar-brand fw-bold" href="../index.html">
                SIMPUS Mini
            </a>

            <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav"
                aria-controls="navbarNav"
                aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="../index.html">Beranda</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active" href="list.html">Daftar Buku</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="tambah.html">Tambah Buku</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="../anggota/list.html">Daftar Anggota</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="../anggota/tambah.html">Tambah Anggota</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>


    <!-- Main Content -->
    <main class="container my-4">

        <div class="card shadow-sm">
            <div class="card-body">

                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h2 class="mb-0">Daftar Buku</h2>

                    <a href="tambah.html" class="btn btn-primary">
                        + Tambah Buku
                    </a>
                </div>

                <!-- Pencarian tabel -->
                <div class="mb-3">
                    <label for="search-input" class="form-label">Cari data</label>
                    <input type="text" id="search-input" class="form-control" placeholder="Cari judul buku..." autocomplete="off">
                </div>

                <!-- Loading indicator -->
                <p id="loading-indicator" style="display:none;">Memuat data...</p>

                <!-- Table -->
                <div class="table-responsive">
                    <table class="table table-striped table-bordered table-hover align-middle" data-filter="buku">

                        <thead class="table-primary">
                            <tr>
                                <th>Judul</th>
                                <th>Pengarang</th>
                                <th>Tahun Terbit</th>
                                <th>Stok</th>
                                <th>Aksi</th>
                            </tr>
                        </thead>

                        <tbody>
                            <!-- Baris diisi dinamis oleh assets/js/buku.js via fetch('../data/buku.json') -->
                        </tbody>
                    </table>
                </div>

            </div>
        </div>

    </main>


    <!-- Footer -->
    <footer class="text-center py-3">
        <p class="mb-0">&copy; 2026 SIMPUS Mini</p>
    </footer>


    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/app.js"></script>
    <script src="../assets/js/buku.js"></script>

</body>
</html>
