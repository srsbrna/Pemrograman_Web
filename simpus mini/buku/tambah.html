<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tambah Buku - SIMPUS Mini</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS Custom -->
    <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-md navbar-dark" style="background-color: #1d5b8a;">
        <div class="container">
            <a class="navbar-brand fw-bold" href="../index.html">
                SIMPUS Mini
            </a>

            <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav"
                aria-controls="navbarNav"
                aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="../index.html">Beranda</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="list.html">Daftar Buku</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active" href="tambah.html">Tambah Buku</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="../anggota/list.html">Daftar Anggota</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="../anggota/tambah.html">Tambah Anggota</a>
                    </li>

                </ul>
            </div>
        </div>
    </nav>


    <!-- Main Content -->
    <main class="container my-4">

        <div class="card shadow-sm">
            <div class="card-body">

                <h2 class="mb-4">Tambah Buku</h2>

                <form>

                    <!-- Judul -->
                    <div class="mb-3">
                        <label for="judul" class="form-label">
                            Judul
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="judul"
                            name="judul"
                            placeholder="Masukkan judul buku"
                        >
                    </div>


                    <!-- Pengarang -->
                    <div class="mb-3">
                        <label for="pengarang" class="form-label">
                            Pengarang
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="pengarang"
                            name="pengarang"
                            placeholder="Masukkan nama pengarang"
                        >
                    </div>


                    <!-- Tahun Terbit -->
                    <div class="mb-3">
                        <label for="tahun" class="form-label">
                            Tahun Terbit
                        </label>

                        <input
                            type="number"
                            class="form-control"
                            id="tahun"
                            name="tahun"
                            placeholder="Masukkan tahun terbit"
                        >
                    </div>


                    <!-- ISBN -->
                    <div class="mb-3">
                        <label for="isbn" class="form-label">
                            ISBN
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="isbn"
                            name="isbn"
                            placeholder="Masukkan ISBN"
                        >
                    </div>


                    <!-- Stok -->
                    <div class="mb-3">
                        <label for="stok" class="form-label">
                            Stok
                        </label>

                        <input
                            type="number"
                            class="form-control"
                            id="stok"
                            name="stok"
                            placeholder="Masukkan jumlah stok"
                        >
                    </div>


                    <!-- Kategori -->
                    <div class="mb-3">
                        <label for="kategori" class="form-label">
                            Kategori
                        </label>

                        <select
                            class="form-select"
                            id="kategori"
                            name="kategori"
                        >
                            <option selected>Pilih kategori</option>
                            <option value="novel">Novel</option>
                            <option value="pendidikan">Pendidikan</option>
                            <option value="agama">Agama</option>
                            <option value="teknologi">Teknologi</option>
                        </select>
                    </div>


                    <!-- Tombol -->
                    <button type="submit" class="btn btn-primary">
                        Simpan
                    </button>

                    <a href="list.html" class="btn btn-secondary">
                        Batal
                    </a>

                </form>

            </div>
        </div>

    </main>


    <!-- Footer -->
    <footer class="text-center py-3">
        <p class="mb-0">&copy; 2026 SIMPUS Mini</p>
    </footer>


    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
